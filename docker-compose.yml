services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: importforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: importforge
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U importforge"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis:/data"]
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["objects:/data"]
  bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    entrypoint: ["/bin/sh", "-c", "until mc alias set local http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY; do sleep 2; done; mc mb --ignore-existing local/importforge"]
  api:
    build: .
    profiles: [app]
    environment: &app-env
      APP_MODE: production
      APP_ORIGIN: ${APP_ORIGIN:-https://localhost:8443}
      DATABASE_URL: postgresql://importforge:${POSTGRES_PASSWORD}@postgres:5432/importforge
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: importforge
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
    depends_on:
      postgres: {condition: service_healthy}
      bucket: {condition: service_completed_successfully}
    ports: ["127.0.0.1:3001:3001"]
    command: sh -c "npm run db:migrate && npm run db:seed && npm run api"
  worker:
    build: .
    profiles: [app]
    environment: *app-env
    depends_on: [api, redis]
    command: npm run worker
volumes:
  postgres:
  redis:
  objects:
